name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      trigger_deploy:
        description: 'Trigger Easypanel deployment webhook after build'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Easypanel Web Service Webhook
        if: ${{ github.event_name == 'push' || github.event.inputs.trigger_deploy == 'true' }}
        env:
          WEB_WEBHOOK: ${{ secrets.EASYPANEL_WEB_WEBHOOK_URL || secrets.EASYPANEL_WEBHOOK_URL }}
        run: |
          if [ -n "$WEB_WEBHOOK" ]; then
            echo "🌐 Disparando webhook de deploy para servicio Web en Easypanel..."
            curl -s -X POST "$WEB_WEBHOOK"
            echo "✅ Webhook del servicio Web ejecutado con éxito."
          else
            echo "ℹ️ EASYPANEL_WEB_WEBHOOK_URL no está definido en GitHub Secrets. Omitiendo webhook Web."
          fi

      - name: Trigger Easypanel Worker Service Webhook
        if: ${{ github.event_name == 'push' || github.event.inputs.trigger_deploy == 'true' }}
        env:
          WORKER_WEBHOOK: ${{ secrets.EASYPANEL_WORKER_WEBHOOK_URL }}
        run: |
          if [ -n "$WORKER_WEBHOOK" ]; then
            echo "⚙️ Disparando webhook de deploy para servicio Worker en Easypanel..."
            curl -s -X POST "$WORKER_WEBHOOK"
            echo "✅ Webhook del servicio Worker ejecutado con éxito."
          else
            echo "ℹ️ EASYPANEL_WORKER_WEBHOOK_URL no está definido en GitHub Secrets. Omitiendo webhook Worker."
          fi
